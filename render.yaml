services:
  - type: web
    name: shopscope-ecommerce-analytics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopscope-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: shopscope-db
    databaseName: shopscope
    user: shopscope_user
